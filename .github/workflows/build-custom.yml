name: Build Custom APatch

on:
  push:
    branches: [ "custom" ]
  workflow_dispatch:

jobs:
  build-custom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply custom patches
        run: |
          git apply --check scripts/patch/apatch-custom.patch
          git apply scripts/patch/apatch-custom.patch
          echo "Custom patch applied successfully"

      - name: Rename manager identity
        run: |
          bash scripts/patch/rename-identity.sh
          echo "Identity renamed"

      - name: Install custom kpimg
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/kpimg \
            https://github.com/qiansekai/APatch/releases/download/kpimg-custom-0.13.9/kpimg-android
          ls -l app/src/main/assets/kpimg
          sha256sum app/src/main/assets/kpimg

      - name: Generate version
        id: parse_version
        run: |
          COMMIT_NUM=$(git rev-list --count HEAD)
          VERSION=$(echo "$COMMIT_NUM + 200 + 10000" | bc)
          echo "Generated Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install toolchain
        run: |
          rustup default stable
          rustup target install aarch64-linux-android

      - name: Install cargo-ndk (prebuilt binary)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apd
          cache-targets: false

      - name: Build with Gradle
        run: |
          echo 'org.gradle.parallel=true' >> gradle.properties
          echo 'org.gradle.vfs.watch=true' >> gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m' >> gradle.properties
          echo 'android.native.buildOutput=verbose' >> gradle.properties
          sed -i 's/org.gradle.configuration-cache=true//g' gradle.properties
          ./gradlew assembleRelease
          echo "BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)" >> $GITHUB_ENV

      - name: Sign Release
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}
        if: ${{ env.SIGNING_KEY != '' }}
        continue-on-error: true
        uses: kevin-david/zipalign-sign-android-release@v2
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          zipAlign: true

      - name: Resign v2-only (KernelPatch trusts a lone v2 signature)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: ${{ env.SIGNING_KEY != '' }}
        run: |
          set -e
          echo "$SIGNING_KEY" | base64 -d > /tmp/ks.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -n1)
          for APK in app/build/outputs/apk/release/*-signed.apk app/build/outputs/apk/debug/*-signed.apk; do
            [ -f "$APK" ] || continue
            $BT/apksigner sign --ks /tmp/ks.jks \
              --ks-pass pass:$KEY_STORE_PASSWORD --key-pass pass:$KEY_PASSWORD \
              --ks-key-alias $ALIAS \
              --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled false \
              --out "$APK.v2" "$APK"
            mv "$APK.v2" "$APK"
            echo "--- $APK"
            $BT/apksigner verify -v "$APK" | head -6
          done
          rm -f /tmp/ks.jks

      - name: Upload build artifact (Release)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        if: ${{ env.SIGNING_KEY != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ap-Custom-Release
          path: |
            ${{ steps.sign_app.outputs.signedReleaseFile }}

